; =====================================================================
;  Cài đặt Âm lịch Việt Nam cho lịch Taskbar
;  Sửa xong chỉ cần lưu file, rồi đóng/mở lại bảng lịch là áp dụng
;  (không cần khởi động lại gì).
; =====================================================================
[AmLich]

; Kiểu hiển thị:
;   dayOnly  = chỉ hiện ngày âm, riêng mùng 1 hiện "1/10"
;   dayMonth = luôn hiện ngày/tháng, ví dụ "14/10"
format=dayMonth

; Cỡ chữ dòng âm lịch (6 - 30)
fontSize=10

; Độ đậm chữ âm lịch, tính bằng % (10 - 100)
opacity=80

; Khoảng cách từ dòng âm lịch tới đáy ô ngày (pixel)
bottomMargin=1

; 1 = đẩy số ngày dương lên phía trên ô để có chỗ cho dòng âm lịch
moveDayNumberUp=1

; Cỡ chữ ngày dương (0 = giữ nguyên như Windows)
dayNumberFontSize=0

; 1 = tô màu mùng 1, ngày rằm và ngày lễ âm lịch
highlightSpecialDays=1
highlightColor=#E04040

; 1 = vào ngày bắt đầu tiết khí thì hiện tên tiết (vd. "Đông chí") thay cho số ngày âm
showSolarTerm=0

; 1 = rê chuột lên một ngày để xem can chi, tiết khí, giờ hoàng đạo, ngày lễ
showTooltip=1

; 1 = hiện thông báo khi âm lịch không hoạt động (thường sau khi Windows cập nhật)
notifyOnError=1

; 1 = ghi log chi tiết của DLL ra file log-ShellHost.exe.txt (dùng khi tìm lỗi)
debugLog=0
